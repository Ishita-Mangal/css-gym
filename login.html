<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/style2.css" />
  </head>
  <body>
    <header>
      <a href="/index.html">
        <img
          id="logo"
          src="https://thumbs.dreamstime.com/b/white-dumbbell-gym-logo-black-background-workout-sign-vector-template-172909186.jpg"
          alt="logo"
        />
      </a>
    </header>
    <main>
      <h2 id="login">LOGIN/SIGN UP</h2>
    </main>
    <div class="box">
      <form class="form">
        <h4 class="header">Name</h4>
        <input class="input1" type="text" placeholder="Enter Name" />

        <h4 class="header">Age</h4>
        <input class="input2" type="number" placeholder="Enter Age" />

        <h4 class="header">Select Gender</h4>
        <label for="1">
          <input type="radio" value="Male" id="male" name="gender" />Male
        </label>
        <label for="2"
          ><input type="radio" value="Female" id="female" name="gender" />Female
        </label>
        <label for="3"
          ><input type="radio" value="Other" id="other" name="gender" />Other
        </label>

        <h4 class="header">Select your City</h4>
        <select class="input4" id="city" placeholder="City">
          <label for="1">
            <option value="Mumbai">Mumbai</option>
          </label>
          <label for="2">
            <option value="Delhi">Delhi</option>
          </label>
          <label for="3">
            <option value="Jaipur">Jaipur</option>
          </label>
          <label for="4">
            <option value="Bengalore">Bengalore</option>
          </label>
        </select>
        <h4 class="header">E-Mail Id</h4>
        <input class="input5" type="email" placeholder="Enter E-mail id" />

        <h4 class="header">Phone No.</h4>
        <input class="input6" type="number" placeholder="Enter Phone no." />
        <br /><br />
        <a href="/index.html"><button class="submit">Submit</button></a>

        <button class="reset">Reset</button>
      </form>
    </div>
  </body>
</html>
